name: Pi-Image bauen

# Erzeugt das flash-fertige bambu-controller.img.xz und hängt es ans Release.
# Start: GitHub → Actions → Pi-Image bauen → Run workflow (oder per Tag v*).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Host-Emulation für armhf (qm-arm via Kernel-binfmt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support arch-test
      - name: Image bauen (pi-gen im Docker, alle Deps inklusive)
        run: |
          cd pi_image
          bash prepare-stage.sh
          (cd pi-gen && sudo ./build-docker.sh -c ./config)
      - name: Image als Artefakt
        uses: actions/upload-artifact@v5
        with:
          name: bambu-controller-img
          path: pi_image/pi-gen/deploy/bambu-controller.img.xz
      - name: Image als Artefakt
        uses: actions/upload-artifact@v5
        with:
          name: bambu-controller-img
          path: pi_image/pi-gen/deploy/*.img.xz
      - name: An Release hängen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pi_image/pi-gen/deploy/*.img.xz
