services:
  bambu-controller:
    build:
      context: ./pi_backend
      dockerfile: Dockerfile
    container_name: bambu-controller
    restart: unless-stopped
    # Wichtig: NICHT zusätzlich environment: PRINTER_* / API_TOKEN setzen —
    # das würde die Werte aus der .env mit leeren Host-Variablen überschreiben.
    env_file:
      - path: ./pi_backend/.env
        required: false
    volumes:
      - bambu-data:/data
      # Fernzugriff (Tailscale) wird bei Bedarf aus der App gestartet:
      # Host-CLI + Socket in den Container reichen, kein zweiter Container.
      - /usr/bin/tailscale:/usr/local/bin/tailscale:ro
      - /var/run/tailscale:/var/run/tailscale
    environment:
      - STORAGE_DIR=/data
      - LOG_LEVEL=INFO
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
    ports:
      - "8000:8000"
    networks:
      - bambu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  bambu-network:
    driver: bridge

volumes:
  bambu-data:
