services:
  bambu-controller:
    build:
      context: ./pi_backend
      dockerfile: Dockerfile
    container_name: bambu-controller
    restart: unless-stopped
    # Wichtig: NICHT zusätzlich environment: PRINTER_* / API_TOKEN setzen —
    # das würde die Werte aus der .env mit leeren Host-Variablen überschreiben.
    env_file:
      - path: ./pi_backend/.env
        required: false
    # Host-Netz ist wichtig: Nur so sieht der Pi das Heimnetz (Drucker-Suche,
    # MQTT, FTP) statt nur das Docker-Netz. Tailscale läuft ebenfalls am Host.
    network_mode: host
    volumes:
      - bambu-data:/data
      # Fernzugriff (Tailscale) wird bei Bedarf aus der App gestartet:
      # Host-CLI + Socket in den Container reichen, kein zweiter Container.
      - /usr/bin/tailscale:/usr/local/bin/tailscale:ro
      - /var/run/tailscale:/var/run/tailscale
    environment:
      - STORAGE_DIR=/data
      - LOG_LEVEL=INFO
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  bambu-data:
