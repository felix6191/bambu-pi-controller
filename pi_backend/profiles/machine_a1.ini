; Bambu Lab A1 — community machine preset (PrusaSlicer/OrcaSlicer compatible).
; Official specs: 256x256x256 mm, 0.4 stainless nozzle, bed max 100C, nozzle max 300C.
; {{NOZZLE}} / {{BED}} are rendered by the slice worker from filaments.json — do not
; rely on slicer placeholders here, so the file works in both PrusaSlicer and OrcaSlicer.
[printer]
printer_model = Bambu Lab A1 (community)
printer_variant = 0.4
nozzle_diameter = 0.4
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
extruder_colour = #FF8000
start_gcode = M104 S{{NOZZLE}} ; preheat nozzle\nM140 S{{BED}} ; preheat bed\nM109 S{{NOZZLE}} ; wait nozzle\nM190 S{{BED}} ; wait bed\nG28 ; home all axes\nG90 ; absolute positioning\nM83 ; relative extrusion\nG1 Z5 F3000 ; lift nozzle\nG1 X30 Y10 F6000 ; move to purge position\nG1 E12 F200 ; purge\nG92 E0 ; reset extruder\n
end_gcode = M104 S0 ; nozzle off\nM140 S0 ; bed off\nG91 ; relative positioning\nG1 Z10 F3000 ; lift\nG90 ; absolute positioning\nG1 X128 Y250 F6000 ; present bed\nM84 ; disable motors\n
