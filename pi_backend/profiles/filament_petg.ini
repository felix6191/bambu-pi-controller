; PETG filament preset (PrusaSlicer/OrcaSlicer compatible). Trockene Spule,
; Klebestift als Trennmittel, Brim empfohlen (stellt der Prozess ein).
[filament]
filament_type = PETG
filament_colour = #FFFFFF
first_layer_temperature = 240
nozzle_temperature = 240
first_layer_bed_temperature = 75
bed_temperature = 75
fan_min_speed = 30
fan_max_speed = 50
retraction_length = 1.0
retraction_speed = 30
