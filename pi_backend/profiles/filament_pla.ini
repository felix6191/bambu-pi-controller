; PLA filament preset (PrusaSlicer/OrcaSlicer compatible). Temps also enforced
; via rendered start G-code from filaments.json.
[filament]
filament_type = PLA
filament_colour = #FFFFFF
first_layer_temperature = 220
nozzle_temperature = 220
first_layer_bed_temperature = 65
bed_temperature = 65
fan_min_speed = 100
fan_max_speed = 100
