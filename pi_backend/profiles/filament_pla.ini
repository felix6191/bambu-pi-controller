; PLA filament preset (PrusaSlicer/OrcaSlicer compatible). Temps also enforced
; via rendered start G-code from filaments.json.
[filament]
filament_type = PLA
filament_colour = #FFFFFF
first_layer_temperature = 215
nozzle_temperature = 215
first_layer_bed_temperature = 60
bed_temperature = 60
fan_min_speed = 100
fan_max_speed = 100
retraction_length = 0.8
retraction_speed = 30
