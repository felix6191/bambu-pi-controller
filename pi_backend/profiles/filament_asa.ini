; ASA filament preset (PrusaSlicer/OrcaSlicer compatible).
; NUR kleine Teile: offener Rahmen, daher Brim + wenig Lüfter + zugfrei.
; Große/flache Teile verziehen sich ohne Einhausung.
[filament]
filament_type = ASA
filament_colour = #FFFFFF
first_layer_temperature = 260
nozzle_temperature = 260
first_layer_bed_temperature = 90
bed_temperature = 90
fan_min_speed = 10
fan_max_speed = 20
retraction_length = 0.8
retraction_speed = 30
