; TPU 95A filament preset (PrusaSlicer/OrcaSlicer compatible).
; Externe Spule (nicht AMS), langsam. Retraction minimal gegen Clogs.
[filament]
filament_type = TPU
filament_colour = #FFFFFF
first_layer_temperature = 228
nozzle_temperature = 228
first_layer_bed_temperature = 40
bed_temperature = 40
fan_min_speed = 50
fan_max_speed = 80
retraction_length = 0.5
retraction_speed = 20
